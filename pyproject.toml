[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nablamath"
version = "0.1.0a1"
description = "Núcleo experimental de cálculo rastreável do NablaMath"
readme = "README.md"
requires-python = ">=3.10,<3.15"
authors = [{name = "NablaMath contributors"}]
dependencies = []

[project.optional-dependencies]
cloud = ["huggingface_hub>=0.25,<2"]
test = ["pytest>=8,<10"]
accelerate = ["jax"]
formal = ["z3-solver>=4.16,<5"]
graphics = ["Pillow>=10.1,<13"]

[project.scripts]
nabla = "nablamath.cli:main"
nabla-lab = "nablamath.singularity.interfaces.terminal:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nablamath.desktop" = ["index.html"]
"nablamath" = ["compatibility.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["legacy", ".git", "build", "dist"]
