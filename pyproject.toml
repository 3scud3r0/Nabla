[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nablamath"
version = "1.0.0"
description = "Laboratório local de cálculo rastreável, verificação matemática, datasets e simulação científica"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10,<3.15"
authors = [{name = "NablaMath contributors"}]
dependencies = []

[project.urls]
Repository = "https://github.com/3scud3r0/Nabla"
Documentation = "https://github.com/3scud3r0/Nabla/blob/main/docs/README.md"
Issues = "https://github.com/3scud3r0/Nabla/issues"

[project.optional-dependencies]
cloud = ["huggingface_hub>=0.25,<2"]
test = ["pytest>=8,<10"]
accelerate = ["jax"]
scipy = ["scipy>=1.11,<2"]
cuda12 = ["cupy-cuda12x>=13,<15; platform_system == 'Linux' or platform_system == 'Windows'"]
triton = ["torch>=2.4,<3; platform_system == 'Linux' and platform_machine == 'x86_64'", "triton>=3,<4; platform_system == 'Linux' and platform_machine == 'x86_64'"]
formal = ["z3-solver>=4.16,<5"]
graphics = ["Pillow>=10.1,<13"]
documents = ["typst>=0.13,<0.15"]
data = ["pyarrow>=18,<24"]
federation = ["cryptography>=43,<47"]
research = ["sympy>=1.14,<2", "numpy>=2,<3"]
advanced = ["sympy>=1.14,<2", "numpy>=2,<3", "scipy>=1.11,<2", "mpmath>=1.3,<2", "PyWavelets>=1.6,<2", "cvxpy>=1.6,<2"]
interop = ["numpy>=2,<3", "pandas>=2,<4", "polars>=1,<2"]
torch = ["torch>=2.4,<3"]
jupyter = ["ipython>=8,<10"]
mpi = ["mpi4py>=4,<5"]
ai = ["jsonschema>=4,<5"]
mcp = ["mcp>=1.12,<2", "jsonschema>=4,<5"]
publishing = ["typst>=0.13,<0.15", "pypdf>=5,<7"]
animation = ["manim>=0.19,<0.21"]

[project.scripts]
nabla = "nablamath.cli:main"
nabla-lab = "nablamath.singularity.interfaces.terminal:main"
nabla-mcp = "nablamath.ai.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nablamath.desktop" = ["index.html"]
"nablamath" = ["compatibility.json", "public_api.json", "msc_coverage.json", "mathematical_expansion.json"]
"nablamath.publishing" = ["templates/*.typ"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["legacy", ".git", "build", "dist"]
