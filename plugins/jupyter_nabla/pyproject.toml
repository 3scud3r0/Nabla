[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jupyter-nabla"
version = "1.0.0"
description = "Auditable Nabla calculation and cell magics"
requires-python = ">=3.10,<3.15"
dependencies = ["nablamath>=1,<2", "ipython>=8,<10"]

[tool.setuptools]
packages = ["jupyter_nabla"]
package-dir = {jupyter_nabla = "."}
