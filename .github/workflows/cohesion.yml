name: Cohesive local alpha
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
    paths:
      - 'src/nablamath/**'
      - 'tests/**'
      - 'tools/cohesion_smoke.py'
      - '.github/workflows/cohesion.yml'
      - 'pyproject.toml'
  pull_request:
    paths:
      - 'src/nablamath/**'
      - 'tests/**'
      - 'tools/cohesion_smoke.py'
      - '.github/workflows/cohesion.yml'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  local-cohesion:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]"
      - name: Offline cohesion smoke
        run: python tools/cohesion_smoke.py
      - name: Calculator, desktop, exact-math and public API tests
        run: python -m pytest -q tests/integration/test_cohesive_cli.py tests/integration/test_scientific_desktop_cohesion.py tests/integration/test_advanced_exact_notebook.py tests/math/test_exact_laboratory.py tests/math/test_advanced_exact_integration.py tests/regression/test_public_api.py
      - name: Read-only release inventory and catalog contract
        run: python tools/release_readiness.py
