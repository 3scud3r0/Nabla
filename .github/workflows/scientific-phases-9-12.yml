name: Scientific phases 9–12 and audit
on:
  push:
  pull_request:
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[test,formal,graphics,documents,data,research]"
      - name: Discovery, controlled policies, domain checks and federation
        run: python -m pytest -q tests/test_phase9_discovery.py tests/test_phase10_evolution.py tests/test_phase11_domains.py tests/test_phase12_knowledge.py tests/test_scientific_audit_experiments.py tests/regression/test_portable_io.py
      - name: Reproduce integrated scientific artifacts
        run: nabla research-laboratory .nabla/research-ci
      - name: Measure independent solvers
        run: nabla independent-benchmark .nabla/independent-solvers.json --count 8 --seed 103 --timeout 15
      - name: Check generated mathematical sources
        run: python tools/build_math_bundle.py --check
      - uses: actions/upload-artifact@v4
        with:
          name: scientific-research-9-12
          path: |
            .nabla/research-ci/
            .nabla/independent-solvers.json
          include-hidden-files: true
