name: Wheel release provenance
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  wheel-provenance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip wheel --no-deps --wheel-dir .nabla/wheels .
      - name: Verify RECORD and preserve dependency declarations
        shell: bash
        run: |
          for wheel in .nabla/wheels/*.whl; do
            python tools/verify_wheel.py "$wheel" > "$wheel.integrity.json"
          done
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: .nabla/wheels/*.whl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-wheels-with-integrity
          path: .nabla/wheels/
          include-hidden-files: true
