name: Scheduled finite scientific checks
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 1 * *' # UTC; finite checks, not an external scientific validation campaign
permissions:
  contents: read
jobs:
  analytic-references:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[test,research]"
      - run: python -m pytest -q tests/test_roadmap_math_extensions.py tests/test_roadmap_worlds_observations.py tests/test_scientific_audit_experiments.py --junitxml=.nabla/scientific-reference-tests.xml
      - run: python tools/validate_longley.py --output .nabla/nist-reference.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: finite-scientific-references
          path: .nabla/
          include-hidden-files: true
