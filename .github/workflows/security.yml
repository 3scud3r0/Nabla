name: Security contracts and wheel integrity
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  bounded-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[test,federation]"
      - run: python -m pip check
      - name: Exercise forgery, replay, approvals and archive safety
        run: python -m pytest -q tests/test_roadmap_network_security.py tests/test_roadmap_agent_controls.py tests/test_roadmap_resources_supplychain.py
      - run: python -m pip wheel --no-deps --wheel-dir .nabla/wheels .
      - name: Verify every built wheel without executing its code
        shell: bash
        run: |
          for wheel in .nabla/wheels/*.whl; do
            python tools/verify_wheel.py "$wheel"
          done
