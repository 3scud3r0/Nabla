name: Frontier inverse-synthesis dataset

on:
  push:
    branches: [feat/frontier-synthesis-20261017]
  pull_request:
    paths:
      - tools/generate_frontier_1000.py
      - tests/test_frontier_dataset_synthesis.py
      - .github/workflows/frontier-synthesis.yml
  workflow_dispatch:

concurrency:
  group: frontier-synthesis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-generation-and-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install native Nabla and symbolic dependencies
        run: python -m pip install -e '.[test,research]'
      - name: Test exact mathematical synthesis and receipts
        run: python -m unittest discover -s tests -p 'test_frontier_dataset_synthesis.py' -v
      - name: Produce one thousand native Nabla receipts
        run: python tools/generate_frontier_1000.py --count 1000 --output .nabla/frontier/dataset_superinteligente_1000.txt
      - name: Rebuild all 1000 samples and reject tampering
        run: python tools/generate_frontier_1000.py --verify --output .nabla/frontier/dataset_superinteligente_1000.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: nabla-frontier-1000-native-${{ github.sha }}
          path: |
            .nabla/frontier/dataset_superinteligente_1000.txt
            .nabla/frontier/dataset_superinteligente_1000.txt.manifest.json

  branch-archives:
    if: github.repository == '3scud3r0/Nabla' && github.event_name == 'push' && github.ref == 'refs/heads/feat/frontier-synthesis-20261017'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Regenerate and verify both canonical source archives
        run: |
          python tools/build_math_bundle.py
          python tools/build_nabla_bundle.py
          python tools/build_math_bundle.py --check
          python tools/build_nabla_bundle.py --check
      - name: Commit generated archives only to isolated PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add math.txt NABLA.TXT
          if ! git diff --cached --quiet; then
            git commit -m 'chore(bundles): regenerate frontier synthesis source archives'
            git push origin HEAD:refs/heads/feat/frontier-synthesis-20261017
          fi
