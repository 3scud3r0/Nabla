name: Integrated fail-closed validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integrated-validation-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  mandatory-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[test,federation,documents,publishing,research]"
      - name: Execute mandatory checks and publish failure evidence
        id: gate
        run: python tools/integrated_validation.py --profile ci --output .nabla/integrated-validation
      - name: Independently validate the evidence and mandatory test counts
        if: success()
        run: python tools/integrated_validation.py --verify .nabla/integrated-validation
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: integrated-validation-${{ github.sha }}
          path: .nabla/integrated-validation/
          include-hidden-files: true
