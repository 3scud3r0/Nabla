name: Integrated validation gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  source-integrity:
    name: Canonical sources and public contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python tools/build_math_bundle.py --check
      - run: python tools/build_nabla_bundle.py --check
      - run: python tools/check_public_contracts.py
      - run: python tools/check_roadmap.py

  publication-regression:
    name: Adversarial publication and bundle regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pip check
      - run: python -m pytest -q tests/test_integrated_publication_validation.py tests/test_math_bundle.py tests/test_nabla_bundle.py

  wheel-smoke:
    name: Wheel build and isolated installation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - name: Verify wheel integrity without importing untrusted code
        shell: bash
        run: |
          for wheel in dist/*.whl; do
            python tools/verify_wheel.py "$wheel"
          done
      - name: Install wheel into isolated virtual environment
        shell: bash
        run: |
          python -m venv /tmp/nabla-wheel-check
          /tmp/nabla-wheel-check/bin/python -m pip install dist/*.whl
          /tmp/nabla-wheel-check/bin/python -c "import nablamath; print(nablamath.__file__)"
