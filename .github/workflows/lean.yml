name: Lean bridge (optional)
on:
  push:
    paths: ['lean/**', 'src/nablamath/formal/**', 'scripts/setup*', 'tools/setup_formal_dependencies.py', '.github/workflows/lean.yml']
  pull_request:
    paths: ['lean/**', 'src/nablamath/formal/**', 'scripts/setup*', 'tools/setup_formal_dependencies.py', '.github/workflows/lean.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install checked compiler and exact manifest commits; build libraries
        run: bash scripts/setup_formal.sh
      - name: Verify lockfile was preserved
        run: git diff --exit-code -- lean/lean-toolchain lean/lakefile.toml lean/lake-manifest.json
      - name: Check generated proof receipts against the kernel
        run: .venv/bin/python -m nablamath.formal_ci
