name: Lean bridge (optional)
on:
  push:
    paths: ['lean/**', 'src/nablamath/formal/**', '.github/workflows/lean.yml']
  pull_request:
    paths: ['lean/**', 'src/nablamath/formal/**', '.github/workflows/lean.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Lake dependencies
        working-directory: lean
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lake" update
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: true
          build-args: Nabla NablaMath
