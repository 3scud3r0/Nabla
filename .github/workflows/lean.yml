name: Pinned Mathlib bridge

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
on:
  push:
    paths: ['lean/**', 'src/nablamath/formal/**', 'scripts/setup*', 'tools/check_formal_environment.py', '.github/workflows/lean.yml']
  pull_request:
    paths: ['lean/**', 'src/nablamath/formal/**', 'scripts/setup*', 'tools/check_formal_environment.py', '.github/workflows/lean.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Prepare immutable toolchain and pinned Mathlib import closure
        run: bash scripts/setup_formal.sh
      - run: .venv/bin/python -m pytest -q tests/test_phase3_formal.py --junitxml=.nabla/mathlib-tests.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mathlib-${{ github.sha }}
          path: .nabla/mathlib-tests.xml
          include-hidden-files: true
