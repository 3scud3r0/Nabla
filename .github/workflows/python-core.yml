name: Python core
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q --junitxml=.nabla/python-tests.xml
      - run: python tools/release_readiness.py --output .nabla/release-inventory.json
      - run: python tools/build_math_bundle.py --check
      - run: python tools/build_nabla_bundle.py --check
      - run: python -m pip wheel --no-deps --wheel-dir .nabla/wheels .
      - name: Install exact wheel offline and replay public CPU workflow
        shell: bash
        run: |
          for wheel in .nabla/wheels/*.whl; do
            python tools/release_readiness.py --wheel "$wheel" --output .nabla/release-wheel.json
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: python-${{ matrix.os }}-${{ matrix.python }}-${{ github.sha }}
          path: |
            .nabla/python-tests.xml
            .nabla/release-inventory.json
            .nabla/release-wheel.json
            .nabla/wheels/
          include-hidden-files: true
