name: Scientific ecosystem adapters
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  optional-cpu-integrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libmpich-dev mpich libcairo2-dev libpango1.0-dev pkg-config ffmpeg fonts-dejavu-core texlive-latex-recommended lmodern poppler-utils dvisvgm
      - run: python -m pip install -e '.[test,advanced,scipy,research,interop,accelerate,mcp,formal,federation,jupyter,mpi,publishing,animation,pairing,editorial]' PyWavelets
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install --no-deps plugins/jupyter_nabla
      - run: python -m pip install 'playwright>=1.50,<2'
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests/test_ecosystem_science.py tests/test_ecosystem_integrations.py tests/test_ecosystem_ai.py tests/test_ecosystem_federation.py tests/test_production_session_trace.py tests/test_production_mathematics.py tests/test_production_ai_device.py tests/test_production_graphics_publishing.py tests/test_msc_mathematics.py tests/test_editorial_layout.py --junitxml=.nabla/ecosystem-tests.xml
      - run: python -m pytest -q tests/test_v1_*.py tests/test_mathematical_expansion_*.py --junitxml=.nabla/v1-tests.xml
      - run: python examples/v1/reproduce.py .nabla/v1-demo
      - run: python examples/v1/scientific_publication.py .nabla/v1-publication
      - run: python examples/science/layers_pipeline.py .nabla/layers-demo
      - run: python examples/science/editorial_showcase.py .nabla/editorial-showcase
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm install --prefix .nabla/gltf-validator --ignore-scripts --no-audit --no-fund gltf-validator@2.0.0-dev.3.10
      - run: node tools/validate_gltf.cjs .nabla/layers-demo/decay.glb .nabla/gltf-validator
      - run: node tools/validate_gltf.cjs .nabla/v1-publication/textured-animated.glb .nabla/gltf-validator
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: scientific-ecosystem-tests
          path: |
            .nabla/ecosystem-tests.xml
            .nabla/v1-tests.xml
            .nabla/v1-demo
            .nabla/v1-publication
            .nabla/layers-demo
            .nabla/editorial-showcase
          include-hidden-files: true
  vscode-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/vscode_nabla
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm test
