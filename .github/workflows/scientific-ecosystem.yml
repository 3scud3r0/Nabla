name: Scientific ecosystem adapters
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  optional-cpu-integrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test,scipy,interop,accelerate,mcp,formal,federation,jupyter,mpi]'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: sudo apt-get update && sudo apt-get install -y libmpich-dev mpich
      - run: python -m pip install --no-deps plugins/jupyter_nabla
      - run: python -m pytest -q tests/test_ecosystem_science.py tests/test_ecosystem_integrations.py tests/test_ecosystem_ai.py tests/test_ecosystem_federation.py --junitxml=.nabla/ecosystem-tests.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: scientific-ecosystem-tests
          path: .nabla/ecosystem-tests.xml
          include-hidden-files: true
  vscode-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/vscode_nabla
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm test
