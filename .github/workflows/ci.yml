name: NablaMath CI
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q --junitxml=.nabla/ci-tests.xml
      - run: python -m unittest discover -s tests -v
      - run: python tools/build_math_bundle.py --check
      - run: python tools/check_roadmap.py
      - run: python tools/roadmap_status.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
        working-directory: website
      - run: npm run build
        working-directory: website
