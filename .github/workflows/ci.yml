name: NablaMath CI
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Prepare pinned Lean and Mathlib for the full laboratory
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: true
          build-args: Nabla NablaMath
      - run: python -m pip install -e ".[test,formal,graphics,documents,data,research,federation]"
      - run: python tools/vision_readiness.py --output .nabla/vision-readiness/ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: vision-readiness
          path: .nabla/vision-readiness/ci/
          include-hidden-files: true
      - run: python -m unittest discover -s tests -v
      - run: python tools/build_math_bundle.py --check
      - run: python tools/check_roadmap.py
      - run: python tools/check_public_contracts.py
      - run: python tools/roadmap_status.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
        working-directory: website
      - run: npm run build
        working-directory: website
