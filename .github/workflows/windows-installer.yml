name: Windows installer

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
    paths:
      - 'src/**'
      - 'tools/release_smoke.py'
      - 'math.txt'
      - 'NABLA.TXT'
      - '.gitattributes'
      - 'tests/**'
      - 'benchmarks/fixtures/**'
      - 'pyproject.toml'
      - 'packaging/windows/**'
      - '.github/workflows/windows-installer.yml'
  pull_request:
    paths: ['src/**', 'tools/release_smoke.py', 'math.txt', 'NABLA.TXT', '.gitattributes', 'tests/**', 'benchmarks/fixtures/**', 'pyproject.toml', 'packaging/windows/**', '.github/workflows/windows-installer.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install application and packager
        run: python -m pip install -e ".[cloud,test]" pyinstaller
      - name: Run Python tests
        run: python -m pytest -q --junitxml=.nabla/windows-installer-tests.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-installer-test-results
          path: .nabla/windows-installer-tests.xml
          include-hidden-files: true
      - name: Freeze standalone application
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name NablaMath --collect-data nablamath --collect-submodules huggingface_hub src/nablamath/desktop/launcher.py
      - name: Smoke test frozen executable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath 'dist/NablaMath/NablaMath.exe' -ArgumentList '--no-browser', '--port', '38291' -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:38291/' -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200 -and $response.Content.Contains('Seu laboratório matemático')) { $ready = $true; break }
              } catch { }
              if ($p.HasExited) { break }
            }
            if (-not $ready) { throw 'Aplicativo empacotado não iniciou o painel local' }
          } finally { if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force } }
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: |
          $packageVersion = python -c "from nablamath import __version__; print(__version__)"
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DProductVersion=$packageVersion" packaging/windows/nablamath.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install, use, repair and uninstall the exact candidate
        shell: pwsh
        run: ./packaging/windows/smoke_installer.ps1 -Installer (Resolve-Path 'release/NablaMath-Setup-Windows.exe')
      - name: Hash exact installer
        shell: pwsh
        run: Get-FileHash release/NablaMath-Setup-Windows.exe -Algorithm SHA256 | Format-List | Out-File release/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NablaMath-Setup-Windows-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 90
