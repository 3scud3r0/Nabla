name: Lean formal core
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install checked compiler and frozen Mathlib; build formal targets
        run: bash scripts/setup_formal.sh
      - name: Preserve all formal pins
        run: git diff --exit-code -- lean/lean-toolchain lean/lakefile.toml lean/lake-manifest.json
      - name: Check kernel receipts and real integration cases
        run: |
          export PATH="$(dirname "$GITHUB_WORKSPACE")/.tools/lean/lean-4.34.0-linux/bin:$PATH"
          .venv/bin/python -m nablamath.formal_ci
          .venv/bin/python -m pytest -q tests/test_phase3_formal.py tests/test_phase4_graphics.py
