name: Lean formal core
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: bash scripts/setup_formal.sh
      - run: .venv/bin/python -m nablamath.formal_ci
      - name: Exercise real formal and geometry workflows
        run: .venv/bin/python -m pytest -q tests/test_phase3_formal.py tests/test_phase4_graphics.py --junitxml=.nabla/formal-core.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: formal-core-${{ github.sha }}
          path: .nabla/formal-core.xml
          include-hidden-files: true
