name: Scientific maturity profiles

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
on:
  push:
  pull_request:
jobs:
  portable-profiles:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[test,formal,graphics,documents,data,research,federation]"
      - name: Exercise new scientific profiles and failure cases
        run: python -m pytest -q tests/test_completion_hardening.py tests/test_maturity_expansion.py tests/evaluation/test_lineage.py tests/test_laboratory_simulation.py --junitxml=.nabla/maturity-tests.xml
      - name: Reproduce compiled publication, signed evidence and numerical checks
        run: python tools/reproduce_completion.py .nabla/completion-portable --pdf-backend typst
      - name: Validate pinned independent NIST statistics
        run: python tools/validate_longley.py --output .nabla/longley-portable.json
      - name: Replay published simulated laboratory dataset and evaluations
        run: python -c "from nablamath.benchmarks.laboratory import verify_laboratory_workload; import sys; sys.exit(0 if verify_laboratory_workload('benchmarks/results/frontier-lab-951017/workload') else 1)"
      - name: Verify canonical mathematical source bundle
        run: python tools/build_math_bundle.py --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scientific-maturity-${{ matrix.os }}
          path: .nabla/
          include-hidden-files: true
