name: Regenerate cohesive-alpha source bundles

on:
  push:
    branches: ['feat/advanced-exact-mathematics-integrated']
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'scripts/**'
      - 'lean/**'
      - 'sdk/**'
      - 'services/**'
      - 'protocol/**'
      - 'website/**'
      - 'packaging/**'
      - 'examples/**'
      - 'templates/**'
      - 'configs/**'
      - '.github/workflows/**'
      - 'pyproject.toml'
      - '.gitattributes'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regenerate-bundles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-bundles:
    if: github.repository == '3scud3r0/Nabla' && github.ref == 'refs/heads/feat/advanced-exact-mathematics-integrated'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Rebuild both bundles using the canonical source scanners
        run: |
          python tools/build_math_bundle.py
          python tools/build_nabla_bundle.py
      - name: Verify generated contents before commit
        run: |
          python tools/build_math_bundle.py --check
          python tools/build_nabla_bundle.py --check
      - name: Commit only the two regenerated source archives
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- math.txt NABLA.TXT
          if ! git diff --cached --quiet; then
            git commit -m 'build: regenerate both source archives from canonical sources'
            git push origin HEAD:feat/advanced-exact-mathematics-integrated
          else
            echo 'Source archives already match the canonical checkout.'
          fi
