name: Canonical source bundle integrity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-bundles-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check-bundles:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify both committed archives against this exact checkout
        run: |
          python tools/build_math_bundle.py --check
          python tools/build_nabla_bundle.py --check
