name: Rational interval and kernel conformance

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
on:
  push:
  pull_request:
jobs:
  exact-mathematics:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash scripts/setup_lean_std.sh
      - run: python -m pip install -e '.[test,research]'
      - name: Independent exact and high precision references
        run: OPENBLAS_NUM_THREADS=1 python -m pytest -q tests/math/test_certified_analysis.py tests/math/test_markov_analysis.py tests/test_lean_std.py tests/test_nabla_bundle.py --junitxml=.nabla/conformance-tests.xml
      - name: Check generated theorem source and typed manifest
        run: python tools/rational_proof_corpus.py --check
      - name: Kernel check all public theorem instances and audit axioms
        run: python tools/rational_proof_corpus.py --verify .nabla/corpus-ci --workers 2 --timeout 600
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rational-conformance
          path: |
            .nabla/conformance-tests.xml
            .nabla/corpus-ci/
          include-hidden-files: true
